name: Release

on:
  push:
    branches: [master]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build, sign, notarize, and verify without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stats-fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'iTvX/stats' && github.actor == 'iTvX' && (inputs.validate_only == true || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, macOS, ARM64, stats-local]
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check release scripts and project
        run: |
          python3 -m py_compile scripts/release.py
          actionlint .github/workflows/release.yaml .github/workflows/local-ci.yml
          python3 Kit/scripts/run-smc-tests.py
      - name: Resolve next release version
        id: release
        run: python3 scripts/release.py version
      - name: Build, sign, notarize, and verify universal app
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: python3 scripts/release.py build
      - name: Publish verified release and update feed
        if: inputs.validate_only != true
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: python3 scripts/release.py publish
